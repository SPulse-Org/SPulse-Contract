[package]
name = "leaderboard"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Issue #18: the reward-path tests mint through a real PULSE token rather
# than a stub, so "which entry point mints" is measured against real supply.
pulse_token = { path = "../pulse_token", features = ["testutils"] }
